[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "info-harbor-backend"
version = "0.1.0"
description = "聚合全球多源 AI 动态，经 LLM 筛选评估后按国家/地区维度展示（后端）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
# 数据采集：抓取 / 反爬 / 正文提取
crawler = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "tenacity>=9.0",
    "fake-useragent>=1.5",
    "playwright>=1.45",
]
# 存储：SQLAlchemy async + MySQL 驱动 + 迁移
storage = [
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    "pymysql>=1.1",
    "alembic>=1.13",
]
# 任务：ARQ + APScheduler
tasks = [
    "arq>=0.26",
    "apscheduler>=3.10",
]
# AI：LLM 网关
ai = [
    "openai>=1.40",
    "anthropic>=0.34",
]
# 去重
dedup = [
    "datasketch>=1.6",
    "rapidfuzz>=3.9",
    "redis>=5.0",
]
# 开发
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
