# 本地基础设施编排（MVP 单机）。api / frontend / worker 镜像在对应阶段加入。
name: info-harbor

services:
  redis:
    image: redis:7-alpine
    container_name: harbor-redis
    command: ["redis-server", "--appendonly", "yes"]
    # 未来容器版映射到 6380，避免与本地 6379 brew 实例冲突
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: harbor-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: harbor
      MINIO_ROOT_PASSWORD: harbor-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  redis_data:
  minio_data:
